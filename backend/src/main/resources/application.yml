server:
  port: ${SERVER_PORT}

spring:
  application:
    name: neffi-fond

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_URL}/realms/${KEYCLOAK_REALM}
          jwk-set-uri: ${KEYCLOAK_URL}/realms/${KEYCLOAK_REALM}/protocol/openid-connect/certs

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration

keycloak:
  realm: ${KEYCLOAK_REALM}
  auth-server-url: ${KEYCLOAK_URL}
  client-id: ${KEYCLOAK_CLIENT_ID}

app:
  bypass-auth: ${AUTH_BYPASS}
  external-api:
    base-url: ${EXTERNAL_API_BASE_URL}
    api-key: ${EXTERNAL_API_KEY}
    api-key-value: ${EXTERNAL_API_KEY_VALUE}

sendgrid:
  api-key: ${SENDGRID_API_KEY:}
  from-email: ${SENDGRID_FROM_EMAIL:noreply@neffifond.com}
  from-name: ${SENDGRID_FROM_NAME:Neffi-com}

admon-fiducia:
  api:
    base-url: ${ADMON_FIDUCIA_API_URL:http://localhost:8092/admonfiducia/api/v1}
    timeout-ms: ${ADMON_FIDUCIA_TIMEOUT_MS:30000}
    key-header: ${ADMON_FIDUCIA_API_KEY_HEADER:}
    key-value: ${ADMON_FIDUCIA_API_KEY_VALUE:}
    dev-test: ${ADMON_FIDUCIA_API_DEV_TEST:false}
logging:
  level:
    com.neffi: DEBUG
    org.springframework.security: INFO
